development:
  adapter: redis
  url: redis://localhost:6379/1

test:
  # System tests use live async WebSocket delivery, whereas unit tests
  # retain the deterministic ActionCable test adapter.
  adapter: <%= ENV["SYSTEM_TEST_REALTIME"] == "1" ? "async" : "test" %>

production:
  adapter: redis
  url: <%= ENV.fetch("REDIS_URL") %>
  channel_prefix: turbo_chat_production
