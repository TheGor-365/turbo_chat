development:
  adapter: redis
  url: <%= ENV.fetch("REDIS_URL", "redis://localhost:6379/1") %>

test:
  # System tests use live async WebSocket delivery, whereas unit tests
  # retain the deterministic ActionCable test adapter.
  adapter: <%= ENV["REDIS_CABLE_INTEGRATION"] == "1" ? "redis" : (ENV["SYSTEM_TEST_REALTIME"] == "1" ? "async" : "test") %>
  url: <%= ENV.fetch("REDIS_URL", "redis://localhost:6379/4") %>

production:
  adapter: redis
  url: <%= Rails.env.production? ? ENV.fetch("REDIS_URL") : "redis://localhost:6379/1" %>
  channel_prefix: turbo_chat_production
