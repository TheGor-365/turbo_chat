      author_note: "Հեղինակի կամընտիր նշում (ոչ համակարգային հրահանգ)։ Լրացնելիս փոխարինում է աշխատանքային տարբերակի նշմանը։ Միայն Grok գործողությունը հստակ գործարկելուց հետո ուղարկվում է համաձայնեցված, սահմանափակ հատվածների հետ։ Ձևանմուշները պահվում են միայն այս սարքում։ Մի գրեք անձնական հաղորդագրություններ, տվյալներ կամ գաղտնիքներ։"
      sources_note: "Ստուգեք մասնակիցների համաձայնությամբ թույլատրված մինչև ինը հատված։ Գեներացման պահին աղբյուրները կարող են փոխվել։"
      brief_spend: "Թույլատրում եմ մեկ վճարովի «Հաճախորդի բրիֆ» հարցում։ Տեղային բյուջեից պահուստավորվում է մինչև $0.10․ ծառայության իրական վճարը կարող է տարբերվել։ Ինքնաշխատ ուղարկում կամ հաստատում չկա։"
      tasks_disabled: "Զրույցի առաջադրանքներն այս միջավայրում անջատված են։"
      context_disabled: "Համատեքստային AI-ն անջատված է։ Սեփական սևագրի խմբագրումը հասանելի է։"
      public_context: "Սա հանրային սենյակ է, որի պատմությունը չի կարող ուղարկվել xAI-ին։ Օգտագործեք փակ զրույց՝ բոլոր մասնակիցների համաձայնությամբ։"
      draft_first: "Սևագիրը խմբագրելու համար նախ գրեք ձեր հաղորդագրությունը։ Համատեքստային առաջարկ կարելի է ստանալ նաև դատարկ դաշտով։"
      evidence_note: "Ցուցադրվում են միայն կառուցվածքային նշանները։ Աղբյուրների հղումները չեն հաստատում փաստերի ճշտությունը, հաճախորդի հաստատումը կամ պայմանավորվածությունները։"
      style_policy: "Grok-ի վեց ձեռքով ոճերը մշակում են միայն ձեր չուղարկված սևագիրը։ Թարգմանության համար անհրաժեշտ է հստակ ընտրել անգլերենը, ռուսերենը կամ հայերենը։"
      provider_policy: "Grok կոճակը սեղմելով հաստատվում է մեկ վճարովի հարցում․ սևագիրը չի ուղարկվում զրուցակցին մինչև «Ուղարկել» կոճակը։ Խմբագրման համար xAI-ին փոխանցվում է միայն ձեր չուղարկված սևագիրը։ Խելացի պատասխանը և զրույցի առաջադրանքներն առանձին գործողություններ են․ բոլոր ներկա մասնակիցների համաձայնությամբ ուղարկվում է մինչև ինը սահմանափակ տեքստային հատված և հեղինակի կամընտիր նշում։ Ֆայլերը, այլ սենյակները և նախկին մասնակիցների հաղորդագրությունները բացառված են։ xAI-ը կարող է պահպանել API հարցումների գրառումները։ Զրույցի ոչ մի հաղորդագրություն ինքնաշխատ չի ուղարկվում։"
      budget: "Մեկ հարցման տեղային առավելագույն պահուստը $0.10 է։ Սահմանաչափերը՝ $0.30 մեկ օգտատիրոջ համար օրական, $1 ամսական և $2 մեկ տեղադրման համար ամսական։ Չհաջողված հարցումները կարող են պահպանել պահուստը։ Մատակարարի իրական վճարը կարող է տարբերվել։"
      manual_unavailable: "Grok-ի ձեռքով գործառույթներն այս միջավայրում անհասանելի են։ Ինքնաշխատ ուղղումը մնում է անջատված։"
