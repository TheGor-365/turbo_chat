name: One-shot Ruby lockfile regeneration

on:
  push:
    branches: [feat/security-baseline-2026-11-03]

permissions:
  contents: write

jobs:
  regenerate:
    if: contains(github.event.head_commit.message, 'resolve-lockfile-stage-1')
    runs-on: ubuntu-22.04
    concurrency:
      group: ruby-lockfile-regeneration
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/security-baseline-2026-11-03
          persist-credentials: true
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.12'
          bundler-cache: false
      - name: Resolve and install Ruby dependencies
        run: |
          gem install bundler --no-document
          bundle lock --update
          bundle install --jobs 4 --retry 3
      - name: Persist a genuine Bundler-generated lockfile to this feature branch
        run: |
          test "$(git branch --show-current)" = "feat/security-baseline-2026-11-03"
          grep -q 'ruby 3.4.12' Gemfile.lock
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Gemfile.lock
          if git diff --cached --quiet; then
            echo "Lockfile unchanged."
          else
            git commit -m "chore: regenerate Gemfile.lock for Ruby 3.4.12"
            git push origin HEAD:feat/security-baseline-2026-11-03
          fi
