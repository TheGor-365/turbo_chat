name: One-shot Rails 7.1 lockfile refresh

on:
  push:
    branches: [feat/security-baseline-2026-11-03]

permissions:
  contents: write

jobs:
  resolve:
    if: contains(github.event.head_commit.message, 'resolve-rails71-stage')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/security-baseline-2026-11-03
          persist-credentials: true
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.12'
          bundler-cache: false
      - name: Re-resolve framework dependencies with Bundler
        run: |
          gem install bundler --no-document
          bundle lock --update rails
          bundle install --jobs 4 --retry 3
      - name: Commit only Bundler generated lockfile
        run: |
          test "$(git branch --show-current)" = "feat/security-baseline-2026-11-03"
          grep -q 'rails (7.1.6)' Gemfile.lock
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Gemfile.lock
          git diff --cached --quiet || (git commit -m "chore: regenerate Rails 7.1.6 lockfile" && git push origin HEAD:feat/security-baseline-2026-11-03)
