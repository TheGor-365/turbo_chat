name: AI Answer / Quiet Depth focused Chrome CI

on:
  pull_request:
    paths:
      - 'app/javascript/controllers/ai_answer_entry_controller.js'
      - 'app/views/layouts/_new_message_form.html.erb'
      - 'test/system/**'
      - '.github/workflows/ai-answer-focused.yml'
  push:
    branches: [feat/ai-answer-quiet-depth-2026-11-19]

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RAILS_ENV: test
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      RAILS_MAX_THREADS: 5
    steps:
      - uses: actions/checkout@v4
      # GitHub's Ubuntu apt mirrors have timed out before test execution.
      # CI-only static binaries, pinned to published npm packages; no app deps.
      # Download with scripts disabled and keep ffmpeg/ffprobe verification.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify pinned local media tools
        timeout-minutes: 5
        run: |
          if ! command -v ffprobe >/dev/null || ! command -v ffmpeg >/dev/null; then
            npm install --prefix "$RUNNER_TEMP/ci-media" --no-save \
              --ignore-scripts --no-audit --no-fund --prefer-online \
              @ffmpeg-installer/linux-x64@4.1.0 @ffprobe-installer/linux-x64@5.2.0
            mkdir -p "$RUNNER_TEMP/ci-media-bin"
            cp "$RUNNER_TEMP/ci-media/node_modules/@ffmpeg-installer/linux-x64/ffmpeg" "$RUNNER_TEMP/ci-media-bin/ffmpeg"
            cp "$RUNNER_TEMP/ci-media/node_modules/@ffprobe-installer/linux-x64/ffprobe" "$RUNNER_TEMP/ci-media-bin/ffprobe"
            chmod 755 "$RUNNER_TEMP/ci-media-bin/ffmpeg" "$RUNNER_TEMP/ci-media-bin/ffprobe"
            echo "$RUNNER_TEMP/ci-media-bin" >> "$GITHUB_PATH"
            export PATH="$RUNNER_TEMP/ci-media-bin:$PATH"
          fi
          command -v ffprobe
          command -v ffmpeg
          ffprobe -version
          ffmpeg -version
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - name: Build frontend assets
        run: |
          corepack enable
          yarn install --frozen-lockfile
          yarn build
          yarn build:css
      - name: Set up database
        run: |
          bin/rails db:prepare
          bin/rails db:migrate
      - name: Selected browser and contract acceptance
        env:
          SYSTEM_TEST_REALTIME: '1'
          REDIS_CABLE_INTEGRATION: '1'
          REDIS_URL: redis://localhost:6379/4
        run: |
          google-chrome --version
          timeout 250s bin/rails test \
            test/system/ai_answer_entry_quiet_depth_system_test.rb \
            test/system/room_latest_scroll_system_test.rb \
            test/system/ai_quick_beautify_system_test.rb \
            test/system/ai_compact_responsive_system_test.rb \
            test/system/conversation_tools_system_test.rb \
            test/system/signal_deck_mobile_system_test.rb \
            test/system/h4_mock_semantic_review_system_test.rb \
            test/system/ai_contextual_reply_system_test.rb --verbose
