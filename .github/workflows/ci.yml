name: Baseline Rails CI

on:
  pull_request:
  push:
    branches: [main, feat/security-baseline-2026-11-03]

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RAILS_ENV: test
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      RAILS_MAX_THREADS: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate locale YAML before Rails boot
        run: ruby script/check_locale_syntax.rb
      # GitHub's Ubuntu apt mirrors have timed out before test execution.
      # CI-only static binaries, pinned to published npm packages; no app deps.
      # Download with scripts disabled and keep ffmpeg/ffprobe verification.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify pinned local media tools
        timeout-minutes: 5
        run: |
          if ! command -v ffprobe >/dev/null || ! command -v ffmpeg >/dev/null; then
            npm install --prefix "$RUNNER_TEMP/ci-media" --no-save \
              --ignore-scripts --no-audit --no-fund --prefer-online \
              @ffmpeg-installer/linux-x64@4.1.0 @ffprobe-installer/linux-x64@5.2.0
            mkdir -p "$RUNNER_TEMP/ci-media-bin"
            cp "$RUNNER_TEMP/ci-media/node_modules/@ffmpeg-installer/linux-x64/ffmpeg" "$RUNNER_TEMP/ci-media-bin/ffmpeg"
            cp "$RUNNER_TEMP/ci-media/node_modules/@ffprobe-installer/linux-x64/ffprobe" "$RUNNER_TEMP/ci-media-bin/ffprobe"
            chmod 755 "$RUNNER_TEMP/ci-media-bin/ffmpeg" "$RUNNER_TEMP/ci-media-bin/ffprobe"
            echo "$RUNNER_TEMP/ci-media-bin" >> "$GITHUB_PATH"
            export PATH="$RUNNER_TEMP/ci-media-bin:$PATH"
          fi
          command -v ffprobe
          command -v ffmpeg
          ffprobe -version
          ffmpeg -version
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - name: Build frontend assets
        env:
          COREPACK_DEFAULT_TO_LATEST: '0'
        run: |
          corepack enable
          test "$(yarn --version)" = "1.22.22"
          yarn install --frozen-lockfile
          yarn build
          yarn build:css
      - name: Set up database
        run: |
          # Replay every migration on the disposable CI database, never load the stale tracked schema.
          bin/rails db:create
          bin/rails db:migrate
          bin/rails db:schema:dump
          echo '=== CANONICAL SCHEMA BEGIN ==='
          cat db/schema.rb
          echo '=== CANONICAL SCHEMA END ==='
      - name: Rails tests
        run: timeout 90s bin/rails test --verbose
      - name: Redis distributed throttle acceptance
        env:
          REDIS_INTEGRATION: '1'
          REDIS_URL: redis://localhost:6379/4
        run: timeout 60s bin/rails test test/services/redis_throttle_integration_test.rb --verbose
      - name: Cross-process ActionCable Redis transport acceptance
        env:
          REDIS_CABLE_INTEGRATION: '1'
          REDIS_URL: redis://localhost:6379/4
        run: timeout 45s bin/rails test test/services/redis_cable_process_test.rb --verbose
      - name: Two-browser realtime system acceptance (real Redis adapter)
        env:
          SYSTEM_TEST_REALTIME: '1'
          REDIS_CABLE_INTEGRATION: '1'
          REDIS_URL: redis://localhost:6379/4
        run: |
          google-chrome --version
          # Keep a hard timeout, but permit the expanded 135+ Chrome suite to
          # finish on variable-speed hosted runners. A true failing assertion
          # still fails; code 124 no longer masks a slow, otherwise green run.
          timeout 360s bin/rails test:system --verbose

  # P3.1c runs independently of the full Rails/Chrome suite, against a
  # newly created CI-only database. It never accesses owner/production data.
  shared-defaults-upgrade-drill:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RAILS_ENV: test
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      P3_DRILL_DB: turbo_chat_p3_drill
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/turbo_chat_p3_drill
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - name: Existing data preserved through upgrade / rollback / re-upgrade
        timeout-minutes: 8
        run: |
          set -euo pipefail
          trap 'dropdb --if-exists --force "$P3_DRILL_DB"' EXIT
          createdb "$P3_DRILL_DB"
          bin/rails db:migrate VERSION=20261118210000
          bundle exec ruby script/p3_shared_defaults_migration_drill.rb seed
          bin/rails db:migrate VERSION=20261124220000
          bundle exec ruby script/p3_shared_defaults_migration_drill.rb verify_up
          bin/rails db:rollback STEP=1
          bundle exec ruby script/p3_shared_defaults_migration_drill.rb verify_down
          bin/rails db:migrate VERSION=20261124220000
          bundle exec ruby script/p3_shared_defaults_migration_drill.rb verify_up
