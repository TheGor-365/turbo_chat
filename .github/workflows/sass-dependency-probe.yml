name: Sass dependency migration probe (temporary)
on:
  push:
    branches: [feat/security-baseline-2026-11-03]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dependency_probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generate lock with external Sass CLI and prove no picomatch
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          node - <<'JS'
          const fs=require('node:fs');
          let pkg=JSON.parse(fs.readFileSync('package.json','utf8'));
          delete pkg.dependencies.sass;
          fs.writeFileSync('package.json',JSON.stringify(pkg,null,2)+'\n');
          JS
          yarn install --non-interactive
          node scripts/check_known_js_advisories.mjs
          echo 'LOCK64_BEGIN'
          base64 -w120 yarn.lock
          echo 'LOCK64_END'
