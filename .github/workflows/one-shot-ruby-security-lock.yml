name: One-shot Ruby vulnerability dependency refresh

on:
  push:
    branches: [feat/security-baseline-2026-11-03]

permissions:
  contents: write

jobs:
  resolve:
    if: contains(github.event.head_commit.message, 'resolve-ruby-security-stage')
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/security-baseline-2026-11-03
          persist-credentials: true
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.12'
          bundler-cache: false
      - name: Resolve and install Ruby dependencies
        run: |
          gem install bundler --no-document
          bundle lock --update
          bundle install --jobs 4 --retry 3
      - name: Commit only Bundler-generated lockfile
        run: |
          test "$(git branch --show-current)" = "feat/security-baseline-2026-11-03"
          grep -q 'devise (5.0.4)' Gemfile.lock
          grep -q 'puma (8.0.2)' Gemfile.lock
          if grep -q 'webdrivers (' Gemfile.lock; then
            echo "Obsolete webdrivers gem still resolved."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Gemfile.lock
          git diff --cached --quiet || (git commit -m "chore: resolve secured Ruby dependencies" && git push origin HEAD:feat/security-baseline-2026-11-03)
