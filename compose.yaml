# Local-only project: no external PostgreSQL or Redis host ports.
# Never use these development credentials or this image for production.
name: turbo-chat-dev
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: turbo_chat_dev_only
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      RAILS_ENV: development
      PGHOST: db
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: turbo_chat_dev_only
      REDIS_URL: redis://redis:6379/1
      RAILS_MAX_THREADS: "5"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    init: true

volumes:
  postgres_data:
  node_modules:
