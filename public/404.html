<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>404 — Page not found · Turbo Chat</title>
    <style>
      :root { color-scheme: dark light; --canvas: #0c121c; --surface: #121b28; --text: #f1f5fb; --muted: #b0bfd2; --accent: #91bcff; --focus: #bad4ff; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; min-height: 100dvh; margin: 0; padding: 24px; display: grid; place-items: center; background: var(--canvas); color: var(--text); font: 15px/1.6 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      main { width: min(100%, 540px); padding: clamp(24px, 6vw, 44px); border-radius: 20px; background: var(--surface); box-shadow: 0 24px 80px rgb(0 0 0 / .15); }
      .brand { display: inline-flex; align-items: center; gap: 11px; font-size: 15px; font-weight: 700; letter-spacing: -.02em; }
      .mark { width: 38px; height: 38px; display: inline-grid; place-items: center; border-radius: 12px; background: #245bd7; color: white; }
      .code { margin: 44px 0 10px; color: var(--accent); font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
      h1 { margin: 0; max-width: 19ch; font-size: clamp(28px, 6vw, 38px); line-height: 1.2; letter-spacing: -.04em; }
      p { margin: 17px 0 28px; color: var(--muted); max-width: 48ch; }
      a { display: inline-flex; min-height: 44px; align-items: center; padding: 0 18px; border-radius: 10px; background: #245bd7; color: white; font-weight: 650; text-decoration: none; }
      a:hover { background: #184bb6; }
      a:focus-visible { outline: 3px solid var(--focus); outline-offset: 4px; }
      @media (prefers-color-scheme: light) {
        :root { --canvas: #f6f8fc; --surface: #fff; --text: #152235; --muted: #52647b; --accent: #235bd5; --focus: #235bd5; }
        main { box-shadow: 0 20px 65px rgb(21 34 53 / .08); }
      }
      @media (max-width: 360px) { body { padding: 12px; } main { padding: 24px 20px; } .code { margin-top: 36px; } }
    </style>
  </head>
  <body>
    <main>
      <div class="brand"><span class="mark"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M20 11.5A7.5 7.5 0 0 1 12.5 19H7l-4 3V11.5A7.5 7.5 0 0 1 10.5 4h2a7.5 7.5 0 0 1 7.5 7.5Z"/><path d="M8 12h7"/></svg></span><span>Turbo Chat</span></div>
      <div class="code">Error 404</div>
      <h1>Page not found</h1>
      <p>The address might be incorrect, or the page may have moved.</p>
      <a href="/">Home</a>
    </main>
  </body>
</html>
